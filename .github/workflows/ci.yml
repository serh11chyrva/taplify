name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: lint
          - name: Typecheck
            command: typecheck
          - name: Unit tests
            command: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: pnpm run ${{ matrix.command }}

  e2e:
    name: Browser tests (${{ matrix.analytics }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - analytics: GA4 disabled
            measurement_id: ""
            spec: ""
          - analytics: GA4 enabled
            measurement_id: G-TAPLIFY123
            spec: tests/e2e/cookie-consent.spec.ts
    env:
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ matrix.measurement_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production app
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e ${{ matrix.spec }}
      - name: Check configured authentication forms
        if: matrix.analytics == 'GA4 disabled'
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/taplify
          BETTER_AUTH_URL: http://127.0.0.1:3000
          BETTER_AUTH_SECRET: auth-form-browser-tests-use-a-stub
          GOOGLE_CLIENT_ID: test-google-client
          GOOGLE_CLIENT_SECRET: test-google-client-secret
        run: pnpm test:e2e tests/e2e/auth-form.spec.ts
