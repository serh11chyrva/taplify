name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: lint
          - name: Typecheck
            command: typecheck
          - name: Unit tests
            command: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: pnpm run ${{ matrix.command }}

  e2e:
    name: Browser tests (${{ matrix.analytics }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - analytics: GA4 disabled
            measurement_id: ""
            spec: ""
          - analytics: GA4 enabled
            measurement_id: G-TAPLIFY123
            spec: tests/e2e/cookie-consent.spec.ts
    env:
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ matrix.measurement_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production app
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e ${{ matrix.spec }}
      - name: Check configured authentication forms
        if: matrix.analytics == 'GA4 disabled'
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/taplify
          BETTER_AUTH_URL: http://127.0.0.1:3000
          BETTER_AUTH_SECRET: auth-form-browser-tests-use-a-stub
          GOOGLE_CLIENT_ID: test-google-client
          GOOGLE_CLIENT_SECRET: test-google-client-secret
        run: pnpm test:e2e tests/e2e/auth-form.spec.ts

  dashboard:
    name: Dashboard workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAPLIFY_DASHBOARD_E2E: "true"
      DASHBOARD_ENABLED: "true"
      PAGE_FORMS_ENABLED: "true"
      PAGE_ANALYTICS_ENABLED: "true"
      PAGE_ANALYTICS_SECRET: dashboard-browser-tests-use-a-page-metrics-key
      ORGANIZATION_INVITATIONS_ENABLED: "true"
      RESEND_API_KEY: test-resend-key
      TAPLIFY_MAIL_FROM: Taplify QA <qa@example.test>
      MONGODB_URI: mongodb://127.0.0.1:27017/taplify_dashboard_test?replicaSet=taplify&directConnection=true
      MONGODB_DB_NAME: taplify_dashboard_test
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: dashboard-browser-tests-use-an-isolated-db
      PUBLIC_SITE_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start an isolated MongoDB replica set
        run: |
          docker run -d --name taplify-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet taplify --bind_ip_all
          timeout 60s bash -c 'until docker exec taplify-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -qx 1; do sleep 2; done'
          docker exec taplify-mongo mongosh --quiet --eval 'rs.initiate({_id:"taplify",members:[{_id:0,host:"localhost:27017"}]})'
          timeout 60s bash -c 'until docker exec taplify-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -qx true; do sleep 2; done'
          node scripts/create-indexes.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run dashboard browser scenarios
        env:
          NODE_OPTIONS: --import=./tests/e2e/mock-resend.mjs
          TAPLIFY_TEST_MAILBOX: ${{ runner.temp }}/taplify-emails.jsonl
        run: pnpm test:e2e tests/e2e/dashboard-workflow.spec.ts
